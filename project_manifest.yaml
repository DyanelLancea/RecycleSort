architecture:
  diagram: "evidence/architecture.png"
  service_model: "IaaS"
  deployment_model: "Public Cloud"
  deployed_by: "Leong Jia En Melissa (2503686)"
  components:
    - "Amazon VPC (rs-vpc): 2 public and 2 private subnets across 2 Availability Zones"
    - "Internet gateway for the public subnets (load balancer and app servers)"
    - "S3 gateway endpoint so servers reach S3 without the public internet"
    - "Security groups rs-alb-sg, rs-app-sg, rs-db-sg: each layer accepts traffic only from the layer in front"
    - "IAM role LabRole via LabInstanceProfile: S3 and Parameter Store access with no access keys on the servers"
    - "Systems Manager Session Manager for browser admin login, with no SSH port open"
    - "Systems Manager Parameter Store: JWT key, admin key, and database addresses as SecureStrings"
    - "AWS KMS default keys for RDS, EBS, S3, and SecureStrings"
    - "Amazon EC2 (t3.medium, Amazon Linux 2023): nginx, React, FastAPI, and the ResNet50 model"
    - "AMI rs-app-ami-v1, the golden image new servers are built from"
    - "Launch template rs-app-lt: image, size, firewall, IAM role, and IMDSv2"
    - "Application Load Balancer rs-alb, the public address across healthy servers"
    - "Target group rs-app-tg: health check GET /health every 15 seconds"
    - "EC2 Auto Scaling rs-app-asg: 2–4 servers, scale out when CPU passes 60%, replace broken instances"
    - "Amazon EBS encrypted disks on each server"
    - "Amazon RDS for PostgreSQL (rs-db): users and scan logs in private subnets, encrypted, daily backups"
    - "Amazon S3 (private, versioned rs-artefacts bucket): the model file"
    - "CloudWatch metrics and dashboard rs-dashboard"
    - "CloudWatch alarms rs-unhealthy-hosts, rs-target-5xx, rs-db-cpu-high, plus the Auto Scaling alarms"
    - "CloudWatch Logs and Logs Insights: /recyclesort/app and /recyclesort/nginx-access"
    - "CloudWatch agent on each server"
    - "Amazon SNS topic rs-alerts: email when an alarm fires"
evidence:
  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"
  monitoring: "evidence/monitoring.md"
data_ai:
  dataset: "data/README.md"
  method: "Supervised 10-class image classification with the trained ResNet50 model in src/app/ml/service.py (battery, biological, cardboard, clothes, glass, metal, paper, plastic, shoes, trash)"
  evaluation: "ResNet50 test accuracy 94.86%, macro F1 0.943 on 1,848 held-out images (analytics/cloudmodel.ipynb cell 19, analytics/results/metrics.json); live 10/10 check in evidence/test-data-ai.md. analytics/evaluate_model.py re-runs the evaluation."
  reproducible_command: "python analytics/evaluate_model.py --dataset data/testing_images --output-dir analytics/results/rerun"
security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: "AWS Parameter Store"
run:
  prerequisites:
    - "Python 3.11+"
    - "Node.js 20+"
    - "Copied src/.env.example to src/.env"
  commands:
    - "python -m venv .venv && source .venv/bin/activate && pip install -r src/requirements.txt"
    - "cd src/frontend && npm install && npm run dev"
    - "cd src && uvicorn app.main:app --host 0.0.0.0 --port 43181"
declarations:
  ai_use: "AI_USE_DECLARATION.md"
  contributions: "TEAM_CONTRIBUTIONS.md"
